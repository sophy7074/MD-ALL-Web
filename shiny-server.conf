# Shiny Server Configuration for MD-ALL
# Production settings with security hardening

# Run as shiny user
run_as shiny;

# Define the location of the site directory and disable caching
server {
  listen 3838;
  
  # Location of the web server logs
  access_log /logs/access.log default;
  error_log /logs/error.log warn;

  # Define the location of the MD-ALL app
  location /mdall {
    # Directory containing app
    app_dir /srv/shiny-server/mdall;
    
    # Log directory
    log_dir /logs/mdall;
    
    # Maximum number of concurrent sessions
    simple_scheduler 15;
    
    # Connection timeout
    app_init_timeout 60;
    app_idle_timeout 600;
    
    # File upload size limit (500 MB)
    client_max_body_size 500m;
    
    # Disable directory indexing
    directory_index off;
    
    # Session timeout
    app_session_timeout 3600;
    
    # Reconnect timeout
    reconnect_timeout 30;
  }
  
  # Root redirects to mdall
  location / {
    app_dir /srv/shiny-server/mdall;
    log_dir /logs/root;
    
    simple_scheduler 15;
    app_init_timeout 60;
    app_idle_timeout 600;
    client_max_body_size 500m;
    directory_index off;
    app_session_timeout 3600;
    reconnect_timeout 30;
  }
  
  # Health check endpoint
  location /health {
    app_dir /srv/shiny-server/health;
    log_dir /logs/health;
  }
}

# Preserve logs
preserve_logs true;

# Sanitize errors (don't expose stack traces in production)
sanitize_errors true;

# Disable X-Powered-By header
http {
  server_tokens off;
}
